# images are available at registry.ocp4.example.com:8443
# imagestreams exist in openshift-virtualization-os-images namespace.
---
apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
  annotations:
    deployOVS: "false"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: kubevirt-hyperconverged
    operators.coreos.com/kubevirt-hyperconverged.openshift-cnv: ""
spec:
  ksmConfiguration:
    nodeLabelSelector: {}
  virtualMachineOptions:
    disableFreePageReporting: false
    disableSerialConsoleLog: true
  higherWorkloadDensity:
    memoryOvercommitPercentage: 100
  liveMigrationConfig:
    allowAutoConverge: false
    allowPostCopy: false
    completionTimeoutPerGiB: 150
    parallelMigrationsPerCluster: 5
    parallelOutboundMigrationsPerNode: 2
    progressTimeout: 150
  certConfig:
    ca:
      duration: 48h0m0s
      renewBefore: 24h0m0s
    server:
      duration: 24h0m0s
      renewBefore: 12h0m0s
  applicationAwareConfig:
    allowApplicationAwareClusterResourceQuota: false
    vmiCalcConfigName: DedicatedVirtualResources
  featureGates:
    enableCommonBootImageImport: false
    downwardMetrics: false
    disableMDevConfiguration: false
    enableApplicationAwareQuota: false
    deployKubeSecondaryDNS: false
    alignCPUs: false
    deployVmConsoleProxy: false
    persistentReservation: false
    autoResourceLimits: true
  workloadUpdateStrategy:
    batchEvictionInterval: 1m0s
    batchEvictionSize: 10
    workloadUpdateMethods:
      - LiveMigrate
  uninstallStrategy: BlockUninstallIfWorkloadsExist
  resourceRequirements:
    vmiCPUAllocationRatio: 10
  workloadSources:
    dataImportCronTemplates:
    - metadata:
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
          cdi.kubevirt.io/storage.import.sourceDesiredDigest: sha256:a17483f5c7eed900fa405570ac0614a01cefb9e6cf8f57d2c4507ff890aa4966
        labels:
          instancetype.kubevirt.io/default-instancetype: u1.medium
          instancetype.kubevirt.io/default-preference: rhel.9
          kubevirt.io/dynamic-credentials-support: "true"
        name: alp-rhel9-image-cron
      spec:
        garbageCollect: Outdated
        importsToKeep: 1
        managedDataSource: alp-rhel9
        retentionPolicy: None
        schedule: ""
        template:
          metadata: {}
          spec:
            source:
              registry:
                pullMethod: node
                url: docker://quay.io/alpaslank/rhel9/rhel-guest-image
            storage:
              resources:
                requests:
                  storage: 10Gi
              storageClassName: lvms-local-lvm-sdb
              volumeMode: Block
          status: {}
    enableCommonBootImageImport: false
